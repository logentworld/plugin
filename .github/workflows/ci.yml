name: API 계약 확인

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: gradle/actions/setup-gradle@v4
      - name: 문서·워크플로 포맷을 검사해요
        run: ./scripts/format.sh
      - name: 공개 ABI와 테스트 및 로컬 Maven 발행을 확인해요
        run: ./gradlew --no-daemon :plugin-api:checkKotlinAbi :plugin-api:test :plugin-api:publishToMavenLocal
      - name: 테스트 결과를 보관해요
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-api-test-results
          path: plugin-api/build/reports/tests/
          if-no-files-found: ignore
